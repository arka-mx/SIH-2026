name: Conflict Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify No Conflict Markers
        run: |
          if grep -rn "^<<<<<<< " .; then
            echo "Error: Conflict markers found in codebase!"
            exit 1
          else
            echo "Clean: No conflict markers found."
          fi
